<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="/admin">LeaveSync</a>
            <nav class="sidebar-nav">
                <a href="/admin/leave-requests" class="sidebar-link">Leave Requests</a>
                <div class="sidebar-group">
                    <button type="button" class="sidebar-link sidebar-group-toggle" data-toggle-target="manage-users-submenu">
                        <span>Manage Users</span> <span class="caret">&#9662;</span>
                    </button>
                    <div class="sidebar-submenu" id="manage-users-submenu">
                                <a href="/admin/policies" class="sidebar-sublink">Policies &amp; Settings</a>
                        <a href="/admin/create-employee" class="sidebar-sublink">Create Employee Account</a>
                        <a href="/admin/manage-users" class="sidebar-sublink">Manage Users &amp; Approval Tiers</a>
                        <a href="/admin/device-requests" class="sidebar-sublink">Device Change Requests</a>
                    </div>
                </div>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container page-container">
        <h1>Administration Dashboard</h1>

        <div class="dashboard-grid" id="admin-stats-grid">
            <div class="stat-card"><h3>Loading...</h3><div class="stat-value">-</div></div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication and verify admin role
        async function initAdmin() {
            const user = await checkAuth();
            if (user.role !== 'admin') {
                window.location.href = '/dashboard';
                return;
            }

            initUserMenu(user);
            initSidebarMenu();
            await loadAdminStatistics();
        }

        async function loadAdminStatistics() {
            const grid = document.getElementById('admin-stats-grid');
            const statsResult = await APIClient.get('admin.php?action=statistics');

            if (!statsResult.success) {
                grid.innerHTML = '<p class="text-center">Failed to load statistics</p>';
                return;
            }

            const stats = statsResult.data || {};

            const cards = [
                { label: 'Total Users', value: stats.total_users ?? 0, href: '/admin/manage-users' },
                { label: 'Active Users', value: stats.active_users ?? 0, href: '/admin/manage-users' },
                { label: 'Pending Account Activations', value: stats.pending_activations ?? 0, href: '/admin/manage-users', urgent: true },
                { label: 'Total Leave Requests', value: stats.total_leave_requests ?? 0, href: '/admin/leave-requests' },
                { label: 'Pending Leave Requests', value: stats.pending_requests ?? 0, href: '/admin/leave-requests', urgent: true },
                { label: 'Pending HR Approval', value: stats.pending_hr_requests ?? 0, href: '/admin/leave-requests', urgent: true },
                { label: 'Approved Leave Requests', value: stats.approved_requests ?? 0, href: '/admin/leave-requests' },
                { label: 'Rejected Leave Requests', value: stats.rejected_requests ?? 0, href: '/admin/leave-requests' },
                { label: 'Cancelled Leave Requests', value: stats.cancelled_requests ?? 0, href: '/admin/leave-requests' },
                { label: 'Pending Device Change Requests', value: stats.pending_device_requests ?? 0, href: '/admin/device-requests', urgent: true }
            ];

            grid.innerHTML = cards.map(c => `
                <a class="stat-card-link" href="${c.href}">
                    <div class="stat-card">
                        <h3>${c.label}</h3>
                        <div class="stat-value${c.urgent && c.value > 0 ? ' urgent' : ''}">${c.value}</div>
                    </div>
                </a>
            `).join('');
        }

        initAdmin();
    </script>
</body>
</html>
