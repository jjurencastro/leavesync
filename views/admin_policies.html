<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Policies and Settings - LeaveSync</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="sidebar-brand" href="/admin">LeaveSync</a><nav class="sidebar-nav"><a href="/admin/leave-requests" class="sidebar-link">Leave Requests</a><a href="/admin/policies" class="sidebar-link active">Policies &amp; Settings</a><a href="/admin/manage-users" class="sidebar-link">Manage Users</a><a href="/admin/device-requests" class="sidebar-link">Device Change Requests</a><a href="/my-info" class="sidebar-link">My Info</a></nav></aside><div class="main-area"><header class="topbar"><div class="user-menu"><button class="user-menu-toggle" id="user-menu-toggle"><span id="user-fullname">Loading...</span> <span>&#9662;</span></button><div class="user-menu-dropdown" id="user-menu-dropdown"><a href="/settings">Settings</a><a href="#" class="logout-link" onclick="logout()">Logout</a></div></div></header><div class="container page-container"><h1>Policies &amp; Settings</h1><div id="alert-container"></div><div class="card"><div class="card-header"><h2>Leave Policies</h2></div><div class="card-body"><table class="table"><thead><tr><th>Leave Type</th><th>Department</th><th>Fiscal Year</th><th>Days</th><th>Approval Threshold</th><th>Status</th></tr></thead><tbody id="policy-table"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></div><div class="card"><div class="card-header"><h2>Application Settings</h2></div><div class="card-body"><textarea id="settings-json" class="form-control" rows="8" placeholder='{"notification.retention_days":"90"}'></textarea><button class="btn btn-primary" style="margin-top: 1rem" onclick="saveSettings()">Save Settings</button></div></div></div></div></div>
<script src="/js/app.js"></script><script>
(async function init() { const user = await checkAuth(); if (!user || user.role !== 'admin') { window.location.href = '/dashboard'; return; } initUserMenu(user); initSidebarMenu(); loadPolicies(); loadSettings(); })();
async function loadPolicies() { const result = await APIClient.get('admin.php?action=policies'); if (!result.success) return; document.getElementById('policy-table').innerHTML = (result.data || []).map(p => `<tr><td>${escapeAttr(p.leave_type_name)}</td><td>${escapeAttr(p.department || 'All')}</td><td>${p.fiscal_year}</td><td>${p.days_per_year}</td><td>${p.approval_threshold_days ?? 'Standard'}</td><td>${Number(p.is_active) ? 'Active' : 'Inactive'}</td></tr>`).join('') || '<tr><td colspan="6">No policies configured</td></tr>'; }
async function loadSettings() { const result = await APIClient.get('admin.php?action=settings'); if (result.success) document.getElementById('settings-json').value = JSON.stringify(result.data || {}, null, 2); }
async function saveSettings() { let data; try { data = JSON.parse(document.getElementById('settings-json').value || '{}'); } catch (e) { UIManager.showAlert('Settings must be valid JSON', 'danger'); return; } const result = await APIClient.put('admin.php?action=update_settings', data); UIManager.showAlert(result.message || 'Unable to save settings', result.success ? 'success' : 'danger'); }
function escapeAttr(value) { return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script></body></html>
