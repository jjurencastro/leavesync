<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container auth-container">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Activate Your Account</h2>
                <p class="text-center" style="color: var(--text-light); margin: 0.5rem 0;">
                    Complete your profile before requesting account activation.
                </p>
            </div>

            <div class="card-body">
                <div id="alert-container"></div>

                <form id="activate-form">
                    <div class="form-group">
                        <label for="username">Assigned username</label>
                        <input type="text" id="username" readonly>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select an option</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" required>
                            <option value="">Select a department</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="position">Position</label>
                        <select id="position" required>
                            <option value="">Select a position</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="supervisor_id">Immediate supervisor</label>
                        <select id="supervisor_id" required>
                            <option value="">Select an approver</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">New Password (min. 8 characters)</label>
                        <input type="password" id="password" name="password" required minlength="8">
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Activate Account</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        (async () => {
            await checkAuth();
            const activationInfo = await AuthManager.getActivationInfo();
            if (activationInfo.success) {
                document.getElementById('username').value = activationInfo.data.user.username;

                const departmentPositions = activationInfo.data.department_positions;
                const departmentSelect = document.getElementById('department');
                const positionSelect = document.getElementById('position');

                activationInfo.data.departments.forEach((department) => {
                    const option = document.createElement('option');
                    option.value = department;
                    option.textContent = department;
                    departmentSelect.appendChild(option);
                });

                const populatePositions = () => {
                    positionSelect.innerHTML = '<option value="">Select a position</option>';
                    (departmentPositions[departmentSelect.value] || []).forEach((position) => {
                        const option = document.createElement('option');
                        option.value = position;
                        option.textContent = position;
                        positionSelect.appendChild(option);
                    });
                };
                departmentSelect.addEventListener('change', populatePositions);

                const supervisorSelect = document.getElementById('supervisor_id');
                const populateSupervisors = () => {
                    supervisorSelect.innerHTML = '<option value="">Select an approver</option>';
                    activationInfo.data.supervisors
                        .filter((supervisor) => supervisor.role === 'admin' || supervisor.department === departmentSelect.value)
                        .forEach((supervisor) => {
                            const option = document.createElement('option');
                            option.value = supervisor.id;
                            option.textContent = supervisor.full_name + (supervisor.role === 'manager' ? ' (Dean)' : '');
                            supervisorSelect.appendChild(option);
                        });
                };
                departmentSelect.addEventListener('change', populateSupervisors);
                populateSupervisors();
            }
        })();

        document.getElementById('activate-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (password !== passwordConfirm) {
                UIManager.showAlert('Passwords do not match', 'danger');
                return;
            }

            const result = await AuthManager.setPassword({
                password,
                gender: document.getElementById('gender').value,
                department: document.getElementById('department').value.trim(),
                position: document.getElementById('position').value.trim(),
                supervisor_id: document.getElementById('supervisor_id').value
            });

            if (result.success) {
                UIManager.showAlert('Password set! Your account now awaits administrator approval. Logging you out...', 'success');
                setTimeout(async () => {
                    await AuthManager.logout();
                    window.location.href = '/login?google_error=' + encodeURIComponent('Your account activation is pending administrator approval.');
                }, 2000);
            } else {
                UIManager.showAlert(result.message || 'Failed to set password', 'danger');
            }
        });
    </script>
</body>
</html>
