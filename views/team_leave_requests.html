<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Leave Requests - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="/dashboard">LeaveSync</a>
            <nav class="sidebar-nav">
                <div class="sidebar-group">
                    <button type="button" class="sidebar-link sidebar-group-toggle open" data-toggle-target="leave-requests-submenu">
                        <span>Leave Requests</span> <span class="caret">&#9662;</span>
                    </button>
                    <div class="sidebar-submenu open" id="leave-requests-submenu">
                        <a href="/new-request" class="sidebar-sublink">New Request</a>
                        <a href="/my-requests" class="sidebar-sublink">My Requests</a>
                        <a href="/team-requests" class="sidebar-sublink active">Team Leave Requests</a>
                    </div>
                </div>
                <a href="/device-requests" class="sidebar-link">Device Change Requests</a>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container page-container">
        <h1>Team Leave Requests</h1>

        <div class="card">
            <div class="card-header">
                <h2>Team Leave Requests</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Type</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requests-table">
                        <tr>
                            <td colspan="7" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function escapeAttr(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        async function initTeamRequests() {
            const user = await checkAuth();
            if (user.role !== 'manager') {
                const landingPages = { admin: '/admin', hr: '/hr' };
                window.location.href = landingPages[user.role] || '/dashboard';
                return;
            }

            initUserMenu(user);
            initSidebarMenu();
            await loadTeamRequests();
        }

        async function loadTeamRequests() {
            const result = await LeaveRequestManager.listRequests();
            const tbody = document.getElementById('requests-table');
            tbody.innerHTML = '';

            if (!result.success) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">Failed to load leave requests</td></tr>';
                return;
            }

            const requests = result.data || [];

            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No leave requests found</td></tr>';
                return;
            }

            requests.forEach(req => {
                const row = document.createElement('tr');
                const canApprove = req.status === 'pending' && req.supervisor_status === 'pending';
                row.innerHTML = `
                    <td><strong>${escapeAttr(req.full_name || '')}</strong></td>
                    <td>${escapeAttr(req.leave_type_name || '')}</td>
                    <td>${UIManager.formatDate(req.start_date)}</td>
                    <td>${UIManager.formatDate(req.end_date)}</td>
                    <td>${req.number_of_days}</td>
                    <td>${UIManager.getStatusBadge(req.status)}</td>
                    <td>
                        <button class="btn btn-small btn-secondary" onclick="viewTeamRequest(${req.id})">View</button>
                        ${canApprove ? `
                            <button class="btn btn-small btn-success" onclick="approveTeamRequest(${req.id})">Approve</button>
                            <button class="btn btn-small btn-danger" onclick="rejectTeamRequest(${req.id})">Reject</button>
                        ` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function viewTeamRequest(id) {
            const result = await LeaveRequestManager.getRequest(id);
            if (!result.success) {
                UIManager.showAlert(result.message || 'Failed to load leave request', 'danger');
                return;
            }

            const req = result.data;
            const content = `
                <table class="table" style="width: 100%;">
                    <tr><th>Employee</th><td>${escapeAttr(req.full_name || '')}</td></tr>
                    <tr><th>Email</th><td>${escapeAttr(req.email || '')}</td></tr>
                    <tr><th>Leave Type</th><td>${escapeAttr(req.leave_type_name || '')}</td></tr>
                    <tr><th>Immediate Supervisor</th><td>${escapeAttr(req.assigned_supervisor_name || req.requester_supervisor_name || req.supervisor_name || 'None assigned')}</td></tr>
                    <tr><th>From Date</th><td>${UIManager.formatDate(req.start_date)}</td></tr>
                    <tr><th>To Date</th><td>${UIManager.formatDate(req.end_date)}</td></tr>
                    <tr><th>Number of Days</th><td>${req.number_of_days}</td></tr>
                    <tr><th>Reason</th><td>${escapeAttr(req.reason || '')}</td></tr>
                    <tr><th>Status</th><td>${UIManager.getApprovalStageBadges(req)}</td></tr>
                    ${req.manager_comments ? `<tr><th>Supervisor Comments</th><td>${escapeAttr(req.manager_comments)}</td></tr>` : ''}
                    ${req.hr_comments ? `<tr><th>HR Comments</th><td>${escapeAttr(req.hr_comments)}</td></tr>` : ''}
                </table>
            `;
            UIManager.showModal(content, 'Leave Request Details');
        }

        async function approveTeamRequest(id) {
            let assertion;
            try {
                assertion = await WebAuthnManager.getApprovalAssertion('leave_request', id);
            } catch (err) {
                UIManager.showAlert(err.message || 'Passkey approval failed', 'danger');
                return;
            }

            const comments = prompt('Optional comments for the employee:') || '';
            const result = await LeaveRequestManager.approveRequest(id, comments, assertion);
            if (result.success) {
                UIManager.showAlert('Leave request approved', 'success');
                loadTeamRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve request', 'danger');
            }
        }

        async function rejectTeamRequest(id) {
            const comments = prompt('Reason for rejection (optional):') || '';
            if (!confirm('Reject this leave request?')) return;

            const result = await LeaveRequestManager.rejectRequest(id, comments);
            if (result.success) {
                UIManager.showAlert('Leave request rejected', 'success');
                loadTeamRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject request', 'danger');
            }
        }

        initTeamRequests();
    </script>
</body>
</html>
