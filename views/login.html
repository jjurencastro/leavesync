<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin: 5rem auto;">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">LeaveSync</h2>
                <p class="text-center" style="color: var(--text-light); margin: 0.5rem 0;">Leave Management System</p>
            </div>
            
            <div class="card-body">
                <div id="alert-container"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div id="mfa-section" style="display: none;">
                        <div class="form-group">
                            <label for="totp">Authenticator Code</label>
                            <input type="text" id="totp" name="totp" placeholder="000000" maxlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>

                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 0.75rem;" id="google-login-btn">Continue with Google</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let loginRequiresMFA = false;
        let loginUserId = null;

        const googleError = new URLSearchParams(window.location.search).get('google_error');
        if (googleError) {
            UIManager.showAlert(googleError, 'danger');
        }

        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const result = await AuthManager.googleLogin();
            if (result.success && result.url) {
                window.location.href = result.url;
            } else {
                UIManager.showAlert(result.message || 'Google login is unavailable', 'danger');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const totp = document.getElementById('totp').value;

            const result = await AuthManager.login(username, password, totp || null);

            if (result.success) {
                UIManager.showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/views/dashboard.html';
                }, 1500);
            } else if (result.requires_mfa) {
                loginRequiresMFA = true;
                loginUserId = result.user_id;
                document.getElementById('mfa-section').style.display = 'block';
                UIManager.showAlert('Please enter your authenticator code', 'info');
            } else {
                UIManager.showAlert(result.message || 'Login failed', 'danger');
            }
        });
    </script>
</body>
</html>
