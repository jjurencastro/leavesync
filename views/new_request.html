<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>New Leave Request - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="/dashboard">LeaveSync</a>
            <nav class="sidebar-nav">
                <div class="sidebar-group">
                    <button type="button" class="sidebar-link sidebar-group-toggle open" data-toggle-target="leave-requests-submenu">
                        <span>Leave Requests</span> <span class="caret">&#9662;</span>
                    </button>
                    <div class="sidebar-submenu open" id="leave-requests-submenu">
                        <a href="/new-request" class="sidebar-sublink active">New Request</a>
                        <a href="/my-requests" class="sidebar-sublink">My Requests</a>
                    </div>
                </div>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container request-layout page-container" style="max-width: 900px;">
        <div class="request-side-panel">
            <div class="card">
                <div class="card-header">
                    <h2>Leave Credits</h2>
                </div>
                <div class="card-body">
                    <div id="balance-pills" class="balance-pills"></div>
                </div>
            </div>
        </div>

        <div class="request-form-panel">
            <div class="card">
                <div class="card-header">
                    <h2>Submit New Leave Request</h2>
                </div>
                
                <form id="leave-form" class="card-body">
                    <div id="alert-container"></div>

                <div class="form-group">
                    <label for="leave-type">Leave Type</label>
                    <select id="leave-type" name="leave_type_id" required>
                        <option value="">Select a leave type</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="start-date">Start Date</label>
                        <input type="date" id="start-date" name="start_date" required>
                    </div>

                    <div class="form-group">
                        <label for="end-date">End Date</label>
                        <input type="date" id="end-date" name="end_date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="days-display">Number of Days</label>
                    <input type="text" id="days-display" disabled placeholder="0 days" style="background-color: var(--light-bg);">
                </div>

                <div class="form-group">
                    <label for="reason">Reason for Leave</label>
                    <textarea id="reason" name="reason" required placeholder="Please provide a reason for your leave request..."></textarea>
                </div>

                <div class="form-group">
                    <label for="attachment">Supporting Document <span id="attachment-hint" style="font-weight: normal; color: var(--text-muted, #6b7280);">(optional)</span></label>
                    <input type="file" id="attachment" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
                    <small style="color: var(--text-muted, #6b7280);">PDF, JPG or PNG, up to 5 MB (e.g. medical certificate).</small>
                </div>

                    <div class="card-footer" style="justify-content: flex-end;">
                        <a href="/dashboard" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const docRequired = {};
        // Check authentication
        (async () => {
            const user = await checkAuth();
            const landingPages = { admin: '/admin', hr: '/hr' };
            if (user && landingPages[user.role]) {
                window.location.href = landingPages[user.role];
            }
            initUserMenu(user);
            initSidebarMenu();
            applyManagerSidebarLinks(user?.role);

            const typesResult = await LeaveRequestManager.getLeaveTypes();
            if (typesResult.success) {
                typesResult.data.forEach((type) => { docRequired[type.id] = Number(type.requires_documentation) === 1; });
                const select = document.getElementById('leave-type');
                sortLeaveTypes(typesResult.data).forEach((type) => {
                    const option = document.createElement('option');
                    option.value = type.id;
                    option.textContent = type.name;
                    select.appendChild(option);
                });
            }

            const balanceResult = await LeaveRequestManager.getLeaveBalance();
            const pillsContainer = document.getElementById('balance-pills');
            if (balanceResult.success) {
                const allBalances = sortLeaveTypes(balanceResult.data, 'leave_type_name');
                const vlSlExhausted = allBalances
                    .filter(b => b.leave_type_name === 'Vacation Leave' || b.leave_type_name === 'Sick Leave')
                    .every(b => Number(b.balance) <= 0);

                allBalances
                    .filter(balance => {
                        if (balance.leave_type_name === 'Leave Without Pay') return vlSlExhausted;
                        if (balance.leave_type_name === 'Maternity Leave') return user.gender === 'female';
                        if (balance.leave_type_name === 'Paternity Leave') return user.gender === 'male';
                        return true;
                    })
                    .forEach(balance => {
                        const pill = document.createElement('span');
                        pill.className = 'balance-pill';
                        pill.innerHTML = `${balance.leave_type_name}: <strong>${balance.balance}</strong>`;
                        pillsContainer.appendChild(pill);
                    });
            }
        })();

        // Calculate days
        document.getElementById('start-date').addEventListener('change', calculateDays);
        document.getElementById('end-date').addEventListener('change', calculateDays);

        function calculateDays() {
            const startValue = document.getElementById('start-date').value;
            const endValue = document.getElementById('end-date').value;
            const startDate = new Date(`${startValue}T00:00:00`);
            const endDate = new Date(`${endValue}T00:00:00`);

            if (startValue && endValue && endDate >= startDate) {
                let days = 0;
                const currentDate = new Date(startDate);
                while (currentDate <= endDate) {
                    const day = currentDate.getDay();
                    if (day !== 0 && day !== 6) days++;
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                document.getElementById('days-display').value = days + ' day' + (days > 1 ? 's' : '');
            }
        }

        document.getElementById('leave-type').addEventListener('change', (e) => {
            document.getElementById('attachment-hint').textContent = docRequired[e.target.value]
                ? '(recommended for this leave type)' : '(optional)';
        });

        // Submit form
        document.getElementById('leave-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const leaveTypeId = document.getElementById('leave-type').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const reason = document.getElementById('reason').value;

            const attachment = document.getElementById('attachment').files[0];
            const fileProblem = validateAttachmentFile(attachment);
            if (fileProblem) {
                UIManager.showAlert(fileProblem, 'danger');
                return;
            }

            const submitButton = document.querySelector('#leave-form button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            const result = await LeaveRequestManager.createRequest(leaveTypeId, startDate, endDate, reason);

            if (result.success) {
                let message = 'Leave request submitted successfully!';
                let type = 'success';
                if (attachment) {
                    const upload = await LeaveRequestManager.uploadAttachment(attachment, result.id);
                    if (!upload.success) {
                        message += ' However, the document could not be attached (' + (upload.message || 'upload failed') + '). You can add it from My Requests.';
                        type = 'warning';
                    }
                }
                UIManager.showAlert(message, type);
                setTimeout(() => {
                    window.location.href = '/my-requests';
                }, type === 'warning' ? 3500 : 1500);
            } else {
                UIManager.showAlert(result.message || 'Failed to submit request', 'danger');
            }

            submitButton.disabled = false;
            submitButton.textContent = 'Submit Request';
        });
    </script>
</body>
</html>
