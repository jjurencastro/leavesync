<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">LeaveSync</div>
            <nav class="sidebar-nav">
                <a href="/views/dashboard.html" class="sidebar-link active">Dashboard</a>
                <a href="/views/new_request.html" class="sidebar-link">New Request</a>
                <a href="/views/my_requests.html" class="sidebar-link">My Requests</a>
                <a href="/views/settings.html" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/views/settings.html">Settings</a>
                        <a href="#" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container" style="padding: 2rem 0;">
        <h1>Dashboard</h1>

        <h2 style="margin: 1.5rem 0 0.5rem;">Leave Credits</h2>
        <div class="dashboard-grid" id="leave-balances-grid">
            <div class="stat-card">
                <h3>Loading...</h3>
                <div class="stat-value">-</div>
            </div>
        </div>

        <div class="card" id="pending-approvals-card" style="display: none;">
            <div class="card-header">
                <h2>Pending Approvals</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Position</th>
                            <th>Requested</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pending-approvals-table">
                        <tr>
                            <td colspan="6" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 id="requests-card-title">Recent Leave Requests</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requests-table">
                        <tr>
                            <td colspan="6" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        async function initDashboard() {
            // Check authentication
            const user = await checkAuth();
            if (!user) return;

            // Admins use the Administration Dashboard instead
            if (user.role === 'admin') {
                window.location.href = '/views/admin.html';
                return;
            }

            // Deans approve pending accounts in their own department here
            if (user.role === 'manager') {
                document.getElementById('pending-approvals-card').style.display = '';
                document.getElementById('requests-card-title').textContent = 'Team Leave Requests';
                loadPendingApprovals();
            }

            initUserMenu(user);

            // Load leave balances, one row per leave type
            const balanceResult = await LeaveRequestManager.getLeaveBalance();
            const balancesGrid = document.getElementById('leave-balances-grid');
            balancesGrid.innerHTML = '';

            if (balanceResult.success && balanceResult.data.length > 0) {
                balanceResult.data.forEach(balance => {
                    const card = document.createElement('div');
                    card.className = 'stat-card';
                    card.innerHTML = `
                        <h3>${balance.leave_type_name}</h3>
                        <div class="stat-value">${balance.balance}</div>
                    `;
                    balancesGrid.appendChild(card);
                });
            } else {
                balancesGrid.innerHTML = '<p class="text-center">No leave credits found</p>';
            }

            // Load recent requests
            const requestResult = await LeaveRequestManager.listRequests();
            if (requestResult.success) {
                const tbody = document.getElementById('requests-table');
                tbody.innerHTML = '';

                if (requestResult.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No leave requests found</td></tr>';
                } else {
                    requestResult.data.slice(0, 5).forEach(req => {
                        const row = document.createElement('tr');
                        const canApprove = user.role === 'manager' && req.status === 'pending';
                        row.innerHTML = `
                            <td>${req.leave_type_name}</td>
                            <td>${UIManager.formatDate(req.start_date)}</td>
                            <td>${UIManager.formatDate(req.end_date)}</td>
                            <td>${req.number_of_days}</td>
                            <td>${UIManager.getStatusBadge(req.status)}</td>
                            <td>
                                <a href="/views/my_requests.html" class="btn btn-small btn-secondary">View</a>
                                ${canApprove ? `
                                    <button class="btn btn-small btn-success" onclick="approveTeamRequest(${req.id})">Approve</button>
                                    <button class="btn btn-small btn-danger" onclick="rejectTeamRequest(${req.id})">Reject</button>
                                ` : ''}
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            }
        }

        async function approveTeamRequest(id) {
            const privateKey = prompt('Paste your private key to digitally sign this approval:');
            if (!privateKey) return;

            const comments = prompt('Optional comments for the employee:') || '';
            const result = await LeaveRequestManager.approveRequest(id, comments, privateKey);
            if (result.success) {
                UIManager.showAlert('Leave request approved', 'success');
                initDashboard();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve request', 'danger');
            }
        }

        async function rejectTeamRequest(id) {
            const comments = prompt('Reason for rejection (optional):') || '';
            if (!confirm('Reject this leave request?')) return;

            const result = await LeaveRequestManager.rejectRequest(id, comments);
            if (result.success) {
                UIManager.showAlert('Leave request rejected', 'success');
                initDashboard();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject request', 'danger');
            }
        }

        initDashboard();

        async function loadPendingApprovals() {
            const result = await APIClient.get('manager.php?action=pending_users');
            const tbody = document.getElementById('pending-approvals-table');
            tbody.innerHTML = '';

            if (!result.success) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Failed to load pending approvals</td></tr>';
                return;
            }

            if (result.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No pending approvals</td></tr>';
                return;
            }

            result.data.forEach(u => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${u.full_name}</td>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>${u.position || ''}</td>
                    <td>${UIManager.formatDate(u.created_at)}</td>
                    <td>
                        <button class="btn btn-small btn-success" onclick="approvePendingUser(${u.id})">Approve</button>
                        <button class="btn btn-small btn-danger" onclick="rejectPendingUser(${u.id})">Reject</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function approvePendingUser(id) {
            if (!confirm('Approve this user account?')) return;

            const result = await APIClient.put(`manager.php?action=approve_user&id=${id}`, {});
            if (result.success) {
                UIManager.showAlert('User approved', 'success');
                loadPendingApprovals();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve user', 'danger');
            }
        }

        async function rejectPendingUser(id) {
            if (!confirm('Reject and delete this pending user account?')) return;

            const result = await APIClient.delete(`manager.php?action=reject_user&id=${id}`);
            if (result.success) {
                UIManager.showAlert('User rejected', 'success');
                loadPendingApprovals();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject user', 'danger');
            }
        }
    </script>
</body>
</html>
