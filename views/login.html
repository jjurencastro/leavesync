<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeaveSync - Login</title>
    <link rel="icon" type="image/png" href="/images/tlc_logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container auth-container">
        <div class="card">
            <div class="card-header">
                <div class="login-logos">
                    <img src="/images/tlc_logo.png" alt="The Lewis College logo">
                    <img src="/images/ccs_logo.png" alt="CCS Department logo">
                </div>
                <h2 class="text-center">LeaveSync</h2>
                <p class="text-center" style="color: var(--text-light); margin: 0.5rem 0;">The Lewis College Leave Management System</p>
            </div>
            
            <div class="card-body">
                <div id="alert-container"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div id="mfa-section" style="display: none;">
                        <div class="form-group">
                            <label for="totp">Authenticator Code</label>
                            <input type="text" id="totp" name="totp" placeholder="000000" maxlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>

                <div id="device-change-section" style="display: none;">
                    <table class="table" id="device-changes-table">
                        <thead>
                            <tr><th>Field</th><th>Previous</th><th>New</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <p>Would you like to request administrator approval to trust this device?</p>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn btn-secondary" style="width: 100%;" id="cancel-device-change-btn">Cancel</button>
                        <button type="button" class="btn btn-primary" style="width: 100%;" id="confirm-device-change-btn">Request Approval</button>
                    </div>
                </div>

                <button type="button" class="btn btn-google" style="width: 100%; margin-top: 0.75rem;" id="google-login-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.71-1.57 2.68-3.88 2.68-6.64z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
                        <path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.04l3.01-2.34z"/>
                        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let loginRequiresMFA = false;
        let loginUserId = null;

        const googleError = new URLSearchParams(window.location.search).get('google_error');
        if (googleError) {
            UIManager.showAlert(googleError, 'danger');
        }

        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const result = await AuthManager.googleLogin();
            if (result.success && result.url) {
                window.location.href = result.url;
            } else {
                UIManager.showAlert(result.message || 'Google login is unavailable', 'danger');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn.disabled) return;
            submitBtn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const totp = document.getElementById('totp').value;

            let result;
            try {
                result = await AuthManager.login(username, password, totp || null);
            } finally {
                submitBtn.disabled = false;
            }

            if (result.success) {
                UIManager.showAlert('Login successful! Redirecting...', 'success');
                setTimeout(async () => {
                    const profile = await AuthManager.getProfile();
                    const landingPages = { admin: '/admin', hr: '/hr' };
                    const destination = (profile.success && landingPages[profile.data.role]) || '/dashboard';
                    window.location.href = destination;
                }, 1500);
            } else if (result.requires_mfa) {
                loginRequiresMFA = true;
                loginUserId = result.user_id;
                document.getElementById('mfa-section').style.display = 'block';
                UIManager.showAlert('Please enter your authenticator code', 'info');
            } else if (result.requires_device_confirmation) {
                showDeviceChanges(result.changes || {});
            } else {
                UIManager.showAlert(result.message || 'Login failed', 'danger');
            }
        });

        function showDeviceChanges(changes) {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('device-change-section').style.display = 'block';

            const tbody = document.querySelector('#device-changes-table tbody');
            tbody.innerHTML = '';
            const keys = Object.keys(changes);

            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center">No details available</td></tr>';
            } else {
                keys.forEach(key => {
                    const c = changes[key];
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${c.label}</td><td>${c.old}</td><td>${c.new}</td>`;
                    tbody.appendChild(row);
                });
            }

            UIManager.showAlert('We noticed a change in your device, browser, or network.', 'info');
        }

        document.getElementById('confirm-device-change-btn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const totp = document.getElementById('totp').value;

            const fingerprint = await DeviceFingerprintManager.getFingerprint();
            const result = await APIClient.post('auth.php?action=login', {
                username, password, totp_code: totp || null, confirm_device_change: true,
                ...fingerprint
            });

            UIManager.showAlert(result.message || (result.success ? 'Request submitted' : 'Failed to submit request'), result.success === false ? 'danger' : 'success');
            document.getElementById('device-change-section').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        });

        document.getElementById('cancel-device-change-btn').addEventListener('click', () => {
            document.getElementById('device-change-section').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        });
    </script>
</body>
</html>
