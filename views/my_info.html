<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Info - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">LeaveSync</div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="/views/dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="/views/new_request.html" class="sidebar-link">New Request</a>
                <a href="/views/my_requests.html" class="sidebar-link">My Requests</a>
                <a href="/views/my_info.html" class="sidebar-link active">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/views/settings.html">Settings</a>
                        <a href="#" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container" style="max-width: 700px; padding: 2rem 0;">
        <h1>My Info</h1>

        <div id="alert-container"></div>

        <!-- Profile Info -->
        <div class="card">
            <div class="card-header">
                <h2>My Profile</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>Full Name</th>
                        <td id="profile-full-name">-</td>
                    </tr>
                    <tr>
                        <th>Employee ID</th>
                        <td id="profile-employee-id">-</td>
                    </tr>
                    <tr>
                        <th>Username</th>
                        <td id="profile-username">-</td>
                    </tr>
                    <tr>
                        <th>Email</th>
                        <td id="profile-email">-</td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- Organization Info -->
        <div class="card">
            <div class="card-header">
                <h2>Organization</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>Department</th>
                        <td id="profile-department">-</td>
                    </tr>
                    <tr>
                        <th>Position</th>
                        <td id="profile-position">-</td>
                    </tr>
                    <tr>
                        <th>Gender</th>
                        <td id="profile-gender">-</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication
        (async () => {
            const user = await checkAuth();
            initUserMenu(user);

            // Admins only see the Admin Dashboard + My Info links, matching the admin landing page
            if (user.role === 'admin') {
                document.getElementById('sidebar-nav').innerHTML = `
                    <a href="/views/admin.html" class="sidebar-link">Admin Dashboard</a>
                    <a href="/views/my_info.html" class="sidebar-link active">My Info</a>
                `;
            }
        })();

        // Load profile
        loadProfile();

        async function loadProfile() {
            const profile = await AuthManager.getProfile();

            if (profile.success) {
                const u = profile.data;
                document.getElementById('profile-full-name').textContent = u.full_name || '-';
                document.getElementById('profile-employee-id').textContent = u.id ?? '-';
                document.getElementById('profile-username').textContent = u.username || '-';
                document.getElementById('profile-email').textContent = u.email || '-';
                document.getElementById('profile-department').textContent = u.department || '-';
                document.getElementById('profile-position').textContent = u.position || '-';
                document.getElementById('profile-gender').textContent = u.gender || '-';
            }
        }
    </script>
</body>
</html>
