<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Leave Request - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">LeaveSync</div>
            <nav class="sidebar-nav">
                <a href="/views/dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="/views/new_request.html" class="sidebar-link active">New Request</a>
                <a href="/views/my_requests.html" class="sidebar-link">My Requests</a>
                <a href="/views/my_info.html" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/views/settings.html">Settings</a>
                        <a href="#" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container" style="max-width: 600px; padding: 2rem 0;">
        <div id="balance-pills" class="balance-pills"></div>

        <div class="card">
            <div class="card-header">
                <h2>Submit New Leave Request</h2>
            </div>
            
            <form id="leave-form" class="card-body">
                <div id="alert-container"></div>

                <div class="form-group">
                    <label for="leave-type">Leave Type</label>
                    <select id="leave-type" name="leave_type_id" required>
                        <option value="">Select a leave type</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="start-date">Start Date</label>
                        <input type="date" id="start-date" name="start_date" required>
                    </div>

                    <div class="form-group">
                        <label for="end-date">End Date</label>
                        <input type="date" id="end-date" name="end_date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="days-display">Number of Days</label>
                    <input type="text" id="days-display" disabled placeholder="0 days" style="background-color: var(--light-bg);">
                </div>

                <div class="form-group">
                    <label for="reason">Reason for Leave</label>
                    <textarea id="reason" name="reason" required placeholder="Please provide a reason for your leave request..."></textarea>
                </div>

                <div class="card-footer" style="justify-content: flex-end;">
                    <a href="/views/dashboard.html" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                </div>
            </form>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication
        (async () => {
            const user = await checkAuth();
            if (user && user.role === 'admin') {
                window.location.href = '/views/admin.html';
            }
            initUserMenu(user);

            const typesResult = await LeaveRequestManager.getLeaveTypes();
            if (typesResult.success) {
                const select = document.getElementById('leave-type');
                typesResult.data.forEach((type) => {
                    const option = document.createElement('option');
                    option.value = type.id;
                    option.textContent = type.name;
                    select.appendChild(option);
                });
            }

            const balanceResult = await LeaveRequestManager.getLeaveBalance();
            const pillsContainer = document.getElementById('balance-pills');
            if (balanceResult.success) {
                const allBalances = balanceResult.data;
                const vlSlExhausted = allBalances
                    .filter(b => b.leave_type_name === 'Vacation Leave' || b.leave_type_name === 'Sick Leave')
                    .every(b => Number(b.balance) <= 0);

                allBalances
                    .filter(balance => {
                        if (balance.leave_type_name === 'Leave Without Pay') return vlSlExhausted;
                        if (balance.leave_type_name === 'Maternity Leave') return user.gender === 'female';
                        if (balance.leave_type_name === 'Paternity Leave') return user.gender === 'male';
                        return true;
                    })
                    .forEach(balance => {
                        const pill = document.createElement('span');
                        pill.className = 'balance-pill';
                        pill.innerHTML = `${balance.leave_type_name}: <strong>${balance.balance}</strong>`;
                        pillsContainer.appendChild(pill);
                    });
            }
        })();

        // Calculate days
        document.getElementById('start-date').addEventListener('change', calculateDays);
        document.getElementById('end-date').addEventListener('change', calculateDays);

        function calculateDays() {
            const startDate = new Date(document.getElementById('start-date').value);
            const endDate = new Date(document.getElementById('end-date').value);

            if (startDate && endDate && endDate >= startDate) {
                const days = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('days-display').value = days + ' day' + (days > 1 ? 's' : '');
            }
        }

        // Submit form
        document.getElementById('leave-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const leaveTypeId = document.getElementById('leave-type').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const reason = document.getElementById('reason').value;

            const submitButton = document.querySelector('#leave-form button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            const result = await LeaveRequestManager.createRequest(leaveTypeId, startDate, endDate, reason);

            if (result.success) {
                UIManager.showAlert('Leave request submitted successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/views/my_requests.html';
                }, 1500);
            } else {
                UIManager.showAlert(result.message || 'Failed to submit request', 'danger');
            }

            submitButton.disabled = false;
            submitButton.textContent = 'Submit Request';
        });
    </script>
</body>
</html>
