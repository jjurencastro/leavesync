<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="/hr">LeaveSync</a>
            <nav class="sidebar-nav">
                <a href="/hr/leave-requests" class="sidebar-link active">Leave Requests</a>
                <a href="/hr/device-requests" class="sidebar-link">Device Change Requests</a>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container page-container">
        <h1>Leave Requests</h1>

        <div class="card">
            <div class="card-header">
                <h2>Leave Requests</h2>
            </div>
            <div class="card-body">
                <div class="leave-request-filters" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1rem;">
                    <div class="form-group" style="margin: 0;">
                        <label for="lr-filter-employee">Employee</label>
                        <input type="text" id="lr-filter-employee" class="form-control" placeholder="Search name" oninput="renderLeaveRequests()">
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label for="lr-filter-type">Leave Type</label>
                        <select id="lr-filter-type" class="form-control" onchange="renderLeaveRequests()">
                            <option value="">All types</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label for="lr-filter-hr-status">HR Approval Status</label>
                        <select id="lr-filter-hr-status" class="form-control" onchange="renderLeaveRequests()">
                            <option value="">All</option>
                            <option value="pending">Pending HR Approval</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label for="lr-filter-from">From</label>
                        <input type="date" id="lr-filter-from" class="form-control" onchange="renderLeaveRequests()">
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label for="lr-filter-to">To</label>
                        <input type="date" id="lr-filter-to" class="form-control" onchange="renderLeaveRequests()">
                    </div>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Type</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Days</th>
                            <th>Supervisor / HR Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leave-requests-table">
                        <tr>
                            <td colspan="7" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication and verify hr role
        async function initHR() {
            const user = await checkAuth();
            if (user.role !== 'hr') {
                window.location.href = '/dashboard';
                return;
            }

            initUserMenu(user);
            initSidebarMenu();
            await loadLeaveRequests();
        }

        let allLeaveRequests = [];

        async function loadLeaveRequests() {
            const result = await LeaveRequestManager.listRequests();

            if (!result.success) {
                document.getElementById('leave-requests-table').innerHTML = '<tr><td colspan="7" class="text-center">Failed to load leave requests</td></tr>';
                return;
            }

            allLeaveRequests = result.data || [];

            // Populate the leave-type filter from the loaded requests
            const typeSelect = document.getElementById('lr-filter-type');
            const types = [...new Set(allLeaveRequests.map(r => r.leave_type_name).filter(Boolean))].sort();
            typeSelect.innerHTML = '<option value="">All types</option>' +
                types.map(t => `<option value="${t}">${t}</option>`).join('');

            renderLeaveRequests();
        }

        function getFilteredLeaveRequests() {
            const employee = (document.getElementById('lr-filter-employee').value || '').trim().toLowerCase();
            const type = document.getElementById('lr-filter-type').value;
            const hrStatus = document.getElementById('lr-filter-hr-status').value;
            const from = document.getElementById('lr-filter-from').value;
            const to = document.getElementById('lr-filter-to').value;

            return allLeaveRequests.filter(req => {
                if (employee && !(req.full_name || '').toLowerCase().includes(employee)) return false;
                if (type && req.leave_type_name !== type) return false;
                if (hrStatus && req.hr_status !== hrStatus) return false;
                if (from && req.start_date < from) return false;
                if (to && req.start_date > to) return false;
                return true;
            });
        }

        function renderLeaveRequests() {
            const tbody = document.getElementById('leave-requests-table');
            tbody.innerHTML = '';

            const requests = getFilteredLeaveRequests();

            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No leave requests found</td></tr>';
                return;
            }

            requests.forEach(req => {
                const row = document.createElement('tr');
                const canApprove = req.status === 'pending' && req.hr_status === 'pending';
                row.innerHTML = `
                    <td>${req.full_name}</td>
                    <td>${req.leave_type_name}</td>
                    <td>${UIManager.formatDate(req.start_date)}</td>
                    <td>${UIManager.formatDate(req.end_date)}</td>
                    <td>${req.number_of_days}</td>
                    <td>${UIManager.getApprovalStageBadges(req)}</td>
                    <td>
                        ${canApprove ? `
                            <button class="btn btn-small btn-success" onclick="approveLeaveRequestHR(${req.id})">Approve</button>
                            <button class="btn btn-small btn-danger" onclick="rejectLeaveRequestHR(${req.id})">Reject</button>
                        ` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function approveLeaveRequestHR(id) {
            let assertion;
            try {
                assertion = await WebAuthnManager.getApprovalAssertion('leave_request', id);
            } catch (err) {
                UIManager.showAlert(err.message || 'Passkey approval failed', 'danger');
                return;
            }

            const comments = prompt('Optional comments for the employee:') || '';
            const result = await LeaveRequestManager.approveRequest(id, comments, assertion);
            if (result.success) {
                UIManager.showAlert('Leave request approved', 'success');
                loadLeaveRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve request', 'danger');
            }
        }

        async function rejectLeaveRequestHR(id) {
            const comments = prompt('Reason for rejection (optional):') || '';
            if (!confirm('Reject this leave request?')) return;

            const result = await LeaveRequestManager.rejectRequest(id, comments);
            if (result.success) {
                UIManager.showAlert('Leave request rejected', 'success');
                loadLeaveRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject request', 'danger');
            }
        }

        initHR();
    </script>
</body>
</html>
