<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="/hr">LeaveSync</a>
            <nav class="sidebar-nav">
                <a href="/hr/leave-requests" class="sidebar-link">Leave Requests</a>
                <a href="/hr/employees" class="sidebar-link">Employee Records</a>
                <a href="/hr/device-requests" class="sidebar-link">Device Change Requests</a>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container page-container">
        <h1>HR Dashboard</h1>

        <div class="dashboard-grid" id="hr-stats-grid">
            <div class="stat-card"><h3>Loading...</h3><div class="stat-value">-</div></div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication and verify hr role
        async function initHR() {
            const user = await checkAuth();
            if (user.role !== 'hr') {
                window.location.href = '/dashboard';
                return;
            }

            initUserMenu(user);
            initSidebarMenu();
            await loadHRStatistics();
        }

        async function loadHRStatistics() {
            const grid = document.getElementById('hr-stats-grid');
            const statsResult = await APIClient.get('hr.php?action=statistics');

            if (!statsResult.success) {
                grid.innerHTML = '<p class="text-center">Failed to load statistics</p>';
                return;
            }

            const stats = statsResult.data || {};

            const cards = [
                { label: 'Total Leave Requests', value: stats.total_leave_requests ?? 0, href: '/hr/leave-requests' },
                { label: 'Pending HR Approval', value: stats.pending_hr_requests ?? 0, href: '/hr/leave-requests', urgent: true },
                { label: 'Approved Leave Requests', value: stats.approved_leave_requests ?? 0, href: '/hr/leave-requests' },
                { label: 'Rejected Leave Requests', value: stats.rejected_leave_requests ?? 0, href: '/hr/leave-requests' },
                { label: 'Pending Device Change Requests', value: stats.pending_device_requests ?? 0, href: '/hr/device-requests', urgent: true }
            ];

            grid.innerHTML = cards.map(c => `
                <a class="stat-card-link" href="${c.href}">
                    <div class="stat-card">
                        <h3>${c.label}</h3>
                        <div class="stat-value${c.urgent && c.value > 0 ? ' urgent' : ''}">${c.value}</div>
                    </div>
                </a>
            `).join('');
        }

        initHR();
    </script>
</body>
</html>
