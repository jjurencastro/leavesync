<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Leave Requests - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">LeaveSync</div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link">Dashboard</a>
                <a href="/new-request" class="sidebar-link">New Request</a>
                <a href="/my-requests" class="sidebar-link active">My Requests</a>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container page-container">
        <div class="flex-between">
            <h1>My Leave Requests</h1>
            <a href="/new-request" class="btn btn-primary">New Request</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                    <button class="btn btn-secondary" onclick="filterRequests('all')">All</button>
                    <button class="btn btn-secondary" onclick="filterRequests('pending')">Pending</button>
                    <button class="btn btn-secondary" onclick="filterRequests('approved')">Approved</button>
                    <button class="btn btn-secondary" onclick="filterRequests('rejected')">Rejected</button>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Days</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="requests-table">
                        <tr>
                            <td colspan="7" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let allRequests = [];
        let currentUser = null;
        let currentFilter = 'all';

        // Check authentication
        (async () => {
            currentUser = await checkAuth();
            const landingPages = { admin: '/admin', hr: '/hr' };
            if (currentUser && landingPages[currentUser.role]) {
                window.location.href = landingPages[currentUser.role];
            }
            initUserMenu(currentUser);
            loadRequests();
        })();

        // Load requests
        async function loadRequests() {
            const result = await LeaveRequestManager.listRequests();
            if (result.success) {
                allRequests = (result.data || []).filter(req => req.user_id === currentUser?.id);
                displayRequests();
            }
        }

        function displayRequests() {
            const tbody = document.getElementById('requests-table');
            tbody.innerHTML = '';

            let filtered = allRequests;
            if (currentFilter !== 'all') {
                filtered = allRequests.filter(req => req.status === currentFilter);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No leave requests found yet. Submit your first request to get started.</td></tr>';
            } else {
                filtered.forEach(req => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${req.leave_type_name}</td>
                        <td>${UIManager.formatDate(req.start_date)}</td>
                        <td>${UIManager.formatDate(req.end_date)}</td>
                        <td>${req.number_of_days}</td>
                        <td>${req.reason.substring(0, 30)}...</td>
                        <td>${UIManager.getApprovalStageBadges(req)}</td>
                        <td>
                            <button class="btn btn-small btn-secondary" onclick="viewRequest(${req.id})">View</button>
                            ${req.status === 'pending' ? `<button class="btn btn-small btn-warning" onclick="editRequest(${req.id})">Edit</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        function filterRequests(status) {
            currentFilter = status;
            displayRequests();
        }

        async function viewRequest(id) {
            const result = await LeaveRequestManager.getRequest(id);
            if (result.success) {
                const req = result.data;
                let signatureInfo = '';
                const signatureHistory = req.signature_history || (req.signature_info ? [req.signature_info] : []);
                if (signatureHistory.length) {
                    const signatureRows = signatureHistory.map((signature, index) => `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${signature.full_name || 'Unknown approver'}</td>
                            <td>${UIManager.formatDate(signature.timestamp)}</td>
                        </tr>
                    `).join('');
                    signatureInfo = `
                        <div class="alert alert-info mt-2">
                            <strong>Digital Approval History</strong>
                            <table class="table mt-2" style="width: 100%;">
                                <thead><tr><th>#</th><th>Signed By</th><th>Timestamp</th></tr></thead>
                                <tbody>${signatureRows}</tbody>
                            </table>
                        </div>
                    `;
                }
                
                const content = `
                    <table class="table" style="width: 100%;">
                        <tr>
                            <th>Leave Type</th>
                            <td>${req.leave_type_name}</td>
                        </tr>
                        <tr>
                            <th>From Date</th>
                            <td>${UIManager.formatDate(req.start_date)}</td>
                        </tr>
                        <tr>
                            <th>To Date</th>
                            <td>${UIManager.formatDate(req.end_date)}</td>
                        </tr>
                        <tr>
                            <th>Number of Days</th>
                            <td>${req.number_of_days}</td>
                        </tr>
                        <tr>
                            <th>Reason</th>
                            <td>${req.reason}</td>
                        </tr>
                        <tr>
                            <th>Status</th>
                            <td>${UIManager.getApprovalStageBadges(req)}</td>
                        </tr>
                        ${req.manager_name ? `
                        <tr>
                            <th>Handled by</th>
                            <td>${req.manager_name}</td>
                        </tr>
                        ` : ''}
                        ${req.manager_comments ? `
                        <tr>
                            <th>Supervisor Comments</th>
                            <td>${req.manager_comments}</td>
                        </tr>
                        ` : ''}
                        ${req.hr_comments ? `
                        <tr>
                            <th>HR Comments</th>
                            <td>${req.hr_comments}</td>
                        </tr>
                        ` : ''}
                    </table>
                    ${signatureInfo}
                `;
                UIManager.showModal(content, 'Leave Request Details');
            }
        }

        function editRequest(id) {
            // Redirect to edit form
            window.location.href = `/views/edit_request.html?id=${id}`;
        }
    </script>
</body>
</html>
