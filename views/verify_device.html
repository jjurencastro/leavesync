<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify New Device - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 450px; margin: 5rem auto;">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Verify New Device</h2>
                <p class="text-center" style="color: var(--text-light); margin: 0.5rem 0;">
                    We noticed a sign-in from a new device or network. Enter the 6-digit code we emailed you to continue.
                </p>
            </div>

            <div class="card-body">
                <div id="alert-container"></div>

                <form id="verify-device-form">
                    <div class="form-group">
                        <label for="code">Verification Code</label>
                        <input type="text" id="code" name="code" placeholder="000000" maxlength="6" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Verify</button>
                </form>

                <p class="text-center mt-3">
                    <a href="/views/login.html" style="color: var(--primary-color);">Back to login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('verify-device-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const code = document.getElementById('code').value;
            const result = await AuthManager.verifyDevice(code);

            if (result.success) {
                UIManager.showAlert('Device verified! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = result.needs_password_setup ? '/views/activate.html' : '/views/dashboard.html';
                }, 1500);
            } else {
                UIManager.showAlert(result.message || 'Verification failed', 'danger');
            }
        });
    </script>
</body>
</html>
