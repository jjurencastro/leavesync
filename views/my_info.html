<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Info - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" id="sidebar-brand-link" href="/dashboard">LeaveSync</a>
            <nav class="sidebar-nav" id="sidebar-nav" style="visibility: hidden;">
                <div class="sidebar-group">
                    <button type="button" class="sidebar-link sidebar-group-toggle" data-toggle-target="leave-requests-submenu">
                        <span>Leave Requests</span> <span class="caret">&#9662;</span>
                    </button>
                    <div class="sidebar-submenu" id="leave-requests-submenu">
                        <a href="/new-request" class="sidebar-sublink">New Request</a>
                        <a href="/my-requests" class="sidebar-sublink">My Requests</a>
                    </div>
                </div>
                <a href="/my-info" class="sidebar-link active">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container page-container narrow-container">
        <h1>My Info</h1>

        <div id="alert-container"></div>

        <!-- Profile Info -->
        <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                <h2>My Profile</h2>
                <button type="button" class="btn btn-small btn-primary" id="edit-profile-button" onclick="toggleProfileEditor()">Edit</button>
            </div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>Full Name</th>
                        <td id="profile-full-name">-</td>
                    </tr>
                    <tr>
                        <th>Employee ID</th>
                        <td id="profile-employee-id">-</td>
                    </tr>
                    <tr>
                        <th>Username</th>
                        <td id="profile-username">-</td>
                    </tr>
                    <tr>
                        <th>Email</th>
                        <td id="profile-email">-</td>
                    </tr>
                    <tr>
                        <th>Gender</th>
                        <td id="profile-gender">-</td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- Organization Info -->
        <div class="card">
            <div class="card-header">
                <h2>Organization</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>Department</th>
                        <td id="profile-department">-</td>
                    </tr>
                    <tr>
                        <th>Position</th>
                        <td id="profile-position">-</td>
                    </tr>
                    <tr>
                        <th>Immediate Supervisor</th>
                        <td id="profile-supervisor">-</td>
                    </tr>
                </table>
            </div>
        </div>

    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication
        (async () => {
            const user = await checkAuth();
            initUserMenu(user);

            // Admins/HR see their own section links instead of the employee Leave Requests dropdown
            const roleNav = {
                admin: {
                    home: '/admin',
                    links: `
                        <a href="/admin/leave-requests" class="sidebar-link">Leave Requests</a>
                        <div class="sidebar-group">
                            <button type="button" class="sidebar-link sidebar-group-toggle" data-toggle-target="manage-users-submenu">
                                <span>Manage Users</span> <span class="caret">&#9662;</span>
                            </button>
                            <div class="sidebar-submenu" id="manage-users-submenu">
                                <a href="/admin/create-employee" class="sidebar-sublink">Create Employee Account</a>
                                <a href="/admin/manage-users" class="sidebar-sublink">Manage Users &amp; Approval Tiers</a>
                                <a href="/admin/device-requests" class="sidebar-sublink">Device Change Requests</a>
                            </div>
                        </div>
                    `
                },
                hr: {
                    home: '/hr',
                    links: `
                        <a href="/hr/leave-requests" class="sidebar-link">Leave Requests</a>
                        <a href="/hr/employees" class="sidebar-link">Employee Records</a>
                        <a href="/hr/device-requests" class="sidebar-link">Device Change Requests</a>
                    `
                }
            };
            if (roleNav[user.role]) {
                document.getElementById('sidebar-brand-link').setAttribute('href', roleNav[user.role].home);
                document.getElementById('sidebar-nav').innerHTML = roleNav[user.role].links +
                    '<a href="/my-info" class="sidebar-link active">My Info</a>';
            }
            document.getElementById('sidebar-nav').style.visibility = 'visible';
            applyManagerSidebarLinks(user.role);
            initSidebarMenu();
        })();

        let profileEditing = false;

        // Load profile
        loadProfile();

        async function loadProfile() {
            const profile = await AuthManager.getProfile();

            if (profile.success) {
                const u = profile.data;
                document.getElementById('profile-full-name').textContent = u.full_name || '-';
                document.getElementById('profile-employee-id').textContent = u.id ?? '-';
                document.getElementById('profile-username').textContent = u.username || '-';
                document.getElementById('profile-email').textContent = u.email || '-';
                document.getElementById('profile-department').textContent = u.department || '-';
                document.getElementById('profile-position').textContent = u.position || '-';
                document.getElementById('profile-supervisor').textContent = u.supervisor_name || 'None assigned';
                document.getElementById('profile-gender').textContent = u.gender ? (u.gender.charAt(0).toUpperCase() + u.gender.slice(1)) : '-';
            }
        }

        function toggleProfileEditor() {
            const button = document.getElementById('edit-profile-button');
            profileEditing = !profileEditing;
            button.textContent = profileEditing ? 'Save' : 'Edit';

            if (profileEditing) {
                makeProfileFieldEditable('profile-full-name', 'text');
                makeProfileFieldEditable('profile-gender', 'gender');
                makeProfileFieldEditable('profile-department', 'text');
                makeProfileFieldEditable('profile-position', 'text');
            } else {
                submitEmployeeProfileUpdate();
            }
        }

        function makeProfileFieldEditable(fieldId, type) {
            const cell = document.getElementById(fieldId);
            const currentValue = cell.textContent === '-' ? '' : cell.textContent;
            cell.textContent = '';

            if (type === 'gender') {
                const select = document.createElement('select');
                select.id = 'edit-gender';
                select.className = 'form-control';
                [['', 'Select'], ['male', 'Male'], ['female', 'Female']].forEach(([value, label]) => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = label;
                    option.selected = value === currentValue.toLowerCase();
                    select.appendChild(option);
                });
                cell.appendChild(select);
                return;
            }

            const input = document.createElement('input');
            input.type = 'text';
            input.id = fieldId.replace('profile-', 'edit-');
            input.className = 'form-control';
            input.value = currentValue;
            cell.appendChild(input);
        }

        async function submitEmployeeProfileUpdate() {
            const payload = {
                full_name: document.getElementById('edit-full-name').value.trim(),
                gender: document.getElementById('edit-gender').value,
                department: document.getElementById('edit-department').value.trim(),
                position: document.getElementById('edit-position').value.trim()
            };

            const result = await AuthManager.updateProfile(payload);
            if (result.success) {
                UIManager.showAlert('Profile updated successfully', 'success');
                profileEditing = false;
                document.getElementById('edit-profile-button').textContent = 'Edit';
                loadProfile();
            } else {
                UIManager.showAlert(result.message || 'Unable to update profile', 'danger');
                profileEditing = true;
            }
        }
    </script>
</body>
</html>
