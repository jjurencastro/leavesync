<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notifications - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="/dashboard" id="home-brand">LeaveSync</a>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link" id="home-link">Home</a>
                <a href="/notifications" class="sidebar-link active">Notifications</a>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" class="logout-link" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

            <div class="container page-container">
                <div class="flex-between">
                    <h1>Notifications</h1>
                    <button class="btn btn-secondary" id="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
                </div>
                <div class="card">
                    <div class="card-body" id="notifications-page-list">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const landing = { admin: '/admin', hr: '/hr', manager: '/dashboard', employee: '/dashboard' };

        async function renderPage() {
            const result = await AuthManager.getAllNotifications();
            const list = document.getElementById('notifications-page-list');
            const button = document.getElementById('mark-all-btn');
            if (!result.success || !(result.data || []).length) {
                list.innerHTML = '<p class="text-muted" style="margin: 0;">No notifications yet.</p>';
                button.disabled = true;
                return;
            }
            button.disabled = Number(result.summary?.unread || 0) === 0;
            list.innerHTML = result.data.map(n => `
                <div class="notification-page-item ${n.read_state === 'unread' ? 'unread' : ''}">
                    <div class="flex-between" style="gap: 0.75rem; flex-wrap: wrap;">
                        <strong>${escapeNotificationText(n.title || 'Notification')}</strong>
                        <small class="text-muted">${escapeNotificationText(UIManager.formatDate(n.created_at))}</small>
                    </div>
                    <p style="margin: 0.25rem 0 0;">${escapeNotificationText(n.message || '')}</p>
                </div>
            `).join('');
        }

        async function markAllRead() {
            const result = await AuthManager.markAllNotificationsRead();
            if (!result.success) {
                UIManager.showAlert(result.message || 'Unable to update notifications', 'danger');
                return;
            }
            renderPage();
            if (window.refreshNotificationBell) window.refreshNotificationBell();
        }

        window.onNotificationsChanged = renderPage;

        (async () => {
            const user = await checkAuth();
            if (!user) return;
            const home = landing[user.role] || '/dashboard';
            document.getElementById('home-link').href = home;
            document.getElementById('home-brand').href = home;
            initUserMenu(user);
            initSidebarMenu();
            renderPage();
        })();
    </script>
</body>
</html>
