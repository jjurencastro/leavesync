<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">LeaveSync</div>
            <nav class="sidebar-nav">
                <a href="/hr" class="sidebar-link active">HR Dashboard</a>
                <a href="/my-info" class="sidebar-link">My Info</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="user-menu">
                    <button class="user-menu-toggle" id="user-menu-toggle">
                        <span id="user-fullname">Loading...</span> <span>&#9662;</span>
                    </button>
                    <div class="user-menu-dropdown" id="user-menu-dropdown">
                        <a href="/settings">Settings</a>
                        <a href="#" onclick="logout()">Logout</a>
                    </div>
                </div>
            </header>

    <div class="container" style="padding: 2rem 0;">
        <h1>HR Dashboard</h1>

        <div class="card">
            <div class="card-header">
                <h2>Leave Requests Awaiting HR Approval</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Type</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Days</th>
                            <th>Supervisor / HR Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leave-requests-table">
                        <tr>
                            <td colspan="7" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication and verify hr role
        async function initHR() {
            const user = await checkAuth();
            if (user.role !== 'hr') {
                window.location.href = '/dashboard';
                return;
            }

            initUserMenu(user);
            loadLeaveRequests();
        }

        async function loadLeaveRequests() {
            const result = await LeaveRequestManager.listRequests();
            const tbody = document.getElementById('leave-requests-table');
            tbody.innerHTML = '';

            if (!result.success) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">Failed to load leave requests</td></tr>';
                return;
            }

            const requests = result.data || [];

            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">No leave requests found</td></tr>';
                return;
            }

            requests.forEach(req => {
                const row = document.createElement('tr');
                const canApprove = req.status === 'pending' && req.hr_status === 'pending';
                row.innerHTML = `
                    <td>${req.full_name}</td>
                    <td>${req.leave_type_name}</td>
                    <td>${UIManager.formatDate(req.start_date)}</td>
                    <td>${UIManager.formatDate(req.end_date)}</td>
                    <td>${req.number_of_days}</td>
                    <td>${UIManager.getApprovalStageBadges(req)}</td>
                    <td>
                        ${canApprove ? `
                            <button class="btn btn-small btn-success" onclick="approveLeaveRequestHR(${req.id})">Approve</button>
                            <button class="btn btn-small btn-danger" onclick="rejectLeaveRequestHR(${req.id})">Reject</button>
                        ` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function approveLeaveRequestHR(id) {
            const comments = prompt('Optional comments for the employee:') || '';
            let assertion;
            try {
                assertion = await WebAuthnManager.getApprovalAssertion('leave_request', id);
            } catch (err) {
                UIManager.showAlert(err.message || 'Passkey approval failed', 'danger');
                return;
            }

            const result = await LeaveRequestManager.approveRequest(id, comments, assertion);
            if (result.success) {
                UIManager.showAlert('Leave request approved', 'success');
                loadLeaveRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve request', 'danger');
            }
        }

        async function rejectLeaveRequestHR(id) {
            const comments = prompt('Reason for rejection (optional):') || '';
            if (!confirm('Reject this leave request?')) return;

            const result = await LeaveRequestManager.rejectRequest(id, comments);
            if (result.success) {
                UIManager.showAlert('Leave request rejected', 'success');
                loadLeaveRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject request', 'danger');
            }
        }

        initHR();
    </script>
</body>
</html>
