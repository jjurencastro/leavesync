<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account - LeaveSync</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container auth-container">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center" id="page-title">Activate Your Account</h2>
                <p class="text-center" id="page-subtitle" style="color: var(--text-light); margin: 0.5rem 0;">
                    Set your password to finish activating your administrator-created account.
                </p>
            </div>

            <div class="card-body">
                <div id="alert-container"></div>

                <form id="activate-form">
                    <div class="form-group">
                        <label for="username">Assigned username</label>
                        <input type="text" id="username" readonly>
                    </div>

                    <div class="form-group">
                        <label>Account details</label>
                        <p id="account-details" style="margin: 0; color: var(--text-light);"></p>
                    </div>

                    <div class="form-group">
                        <label for="password">New Password (min. 8 characters)</label>
                        <input type="password" id="password" name="password" required minlength="8">
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
                    </div>

                    <label style="display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 1rem;">
                        <input type="checkbox" id="trust-device" required style="margin-top: 0.25rem;">
                        <span>I understand that the device I am using now will be registered as my trusted device.</span>
                    </label>

                    <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Set Password and Activate</button>
                </form>
                <button id="logout-btn" class="btn btn-danger" style="width: 100%; margin-top: 0.5rem;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        let isResetFlow = false;

        document.getElementById('logout-btn').addEventListener('click', async () => {
            const button = document.getElementById('logout-btn');
            button.disabled = true;
            // Reset flow: Cancel must only log out. First activation: Cancel removes
            // the abandoned account (cancelActivation rejects established accounts).
            const result = isResetFlow
                ? (await AuthManager.logout(), { success: true })
                : await AuthManager.cancelActivation();
            if (result.success) {
                window.location.href = '/login';
                return;
            }
            button.disabled = false;
            UIManager.showAlert(result.message || 'Unable to cancel account activation', 'danger');
        });

        (async () => {
            await checkAuth();
            const activationInfo = await AuthManager.getActivationInfo();
            if (activationInfo.success) {
                isResetFlow = !!activationInfo.data.is_reset;
                document.getElementById('username').value = activationInfo.data.user.username;
                const user = activationInfo.data.user;
                document.getElementById('account-details').textContent =
                    `${user.full_name} | ${user.email}`;

                if (isResetFlow) {
                    document.title = 'Reset Password - LeaveSync';
                    document.getElementById('page-title').textContent = 'Reset Your Password';
                    document.getElementById('page-subtitle').textContent =
                        'Set a new password to regain access to your account.';
                    document.getElementById('submit-btn').textContent = 'Set New Password';
                }
            }
        })();

        document.getElementById('activate-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (password !== passwordConfirm) {
                UIManager.showAlert('Passwords do not match', 'danger');
                return;
            }

            const result = await AuthManager.setPassword({
                password,
                trust_device: document.getElementById('trust-device').checked
            });

            if (result.success) {
                window.location.href = '/dashboard';
            } else {
                UIManager.showAlert(result.message || 'Failed to set password', 'danger');
            }
        });
    </script>
</body>
</html>
