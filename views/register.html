<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Leave Management System</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 500px; margin: 2rem auto;">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Create Account</h2>
                <p class="text-center" style="color: var(--text-light); margin: 0.5rem 0;">Join LeaveSync Today</p>
            </div>
            
            <div class="card-body">
                <div id="alert-container"></div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" name="department">
                    </div>

                    <div class="form-group">
                        <label for="password">Password (min. 8 characters)</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <input type="password" id="password_confirm" name="password_confirm" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                </form>

                <p class="text-center mt-3">
                    Already have an account? <a href="/views/login.html" style="color: var(--primary-color);">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/public/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const department = document.getElementById('department').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (password !== passwordConfirm) {
                UIManager.showAlert('Passwords do not match', 'danger');
                return;
            }

            const result = await AuthManager.register(username, email, password, fullName, department);

            if (result.success) {
                UIManager.showAlert('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/views/login.html';
                }, 1500);
            } else {
                UIManager.showAlert(result.message || 'Registration failed', 'danger');
            }
        });
    </script>
</body>
</html>
