<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">LeaveSync</div>
                <ul class="navbar-menu">
                    <li><a href="/views/dashboard.html">Dashboard</a></li>
                    <li><a href="/views/admin.html">Admin</a></li>
                    <li><a href="/views/settings.html">Settings</a></li>
                    <li><a href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding: 2rem 0;">
        <h1>Administration Dashboard</h1>

        <div class="card">
            <div class="card-header">
                <h2>Pending User Approvals</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Requested</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pending-users-table">
                        <tr>
                            <td colspan="5" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Pending Device Change Requests</h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>What Changed</th>
                            <th>Requested</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="pending-devices-table">
                        <tr>
                            <td colspan="4" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication and verify admin role
        async function initAdmin() {
            const user = await checkAuth();
            if (user.role !== 'admin') {
                window.location.href = '/views/dashboard.html';
            }

            loadPendingUsers();
            loadPendingDeviceRequests();
        }

        async function loadPendingUsers() {
            const result = await APIClient.get('admin.php?action=users');
            const tbody = document.getElementById('pending-users-table');
            tbody.innerHTML = '';

            if (!result.success) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Failed to load users</td></tr>';
                return;
            }

            // Only show accounts that finished setting up their password (i.e. actually requested activation)
            const pendingUsers = (result.data || []).filter(u => !u.is_active && u.password_set);

            if (pendingUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">No pending approvals</td></tr>';
                return;
            }

            pendingUsers.forEach(u => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${u.full_name}</td>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>${UIManager.formatDate(u.created_at)}</td>
                    <td>
                        <button class="btn btn-small btn-success" onclick="approveUser(${u.id})">Approve</button>
                        <button class="btn btn-small btn-danger" onclick="rejectUser(${u.id})">Reject</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function approveUser(id) {
            if (!confirm('Approve this user account?')) return;

            const result = await APIClient.put(`admin.php?action=update_user&id=${id}`, { is_active: 1 });
            if (result.success) {
                UIManager.showAlert('User approved', 'success');
                loadPendingUsers();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve user', 'danger');
            }
        }

        async function rejectUser(id) {
            if (!confirm('Reject and delete this pending user account?')) return;

            const result = await APIClient.delete(`admin.php?action=delete_user&id=${id}`);
            if (result.success) {
                UIManager.showAlert('User rejected', 'success');
                loadPendingUsers();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject user', 'danger');
            }
        }

        async function loadPendingDeviceRequests() {
            const result = await APIClient.get('admin.php?action=device_requests');
            const tbody = document.getElementById('pending-devices-table');
            tbody.innerHTML = '';

            if (!result.success) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">Failed to load device requests</td></tr>';
                return;
            }

            const requests = result.data || [];

            if (requests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">No pending device requests</td></tr>';
                return;
            }

            requests.forEach(r => {
                const changes = r.changes || {};
                const changeKeys = Object.keys(changes);
                const changeSummary = changeKeys.length === 0
                    ? 'No trusted device on file yet'
                    : changeKeys.map(key => {
                        const c = changes[key];
                        return `<strong>${c.label}:</strong> ${c.old} &rarr; ${c.new}`;
                    }).join('<br>');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${r.full_name} (${r.username})</td>
                    <td>${changeSummary}</td>
                    <td>${UIManager.formatDate(r.requested_at)}</td>
                    <td>
                        <button class="btn btn-small btn-success" onclick="approveDeviceRequest(${r.id})">Approve</button>
                        <button class="btn btn-small btn-danger" onclick="rejectDeviceRequest(${r.id})">Reject</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function approveDeviceRequest(id) {
            if (!confirm('Trust this device for the user?')) return;

            const result = await APIClient.put(`admin.php?action=approve_device_request&id=${id}`, {});
            if (result.success) {
                UIManager.showAlert('Device approved', 'success');
                loadPendingDeviceRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to approve device', 'danger');
            }
        }

        async function rejectDeviceRequest(id) {
            if (!confirm('Reject this device change request?')) return;

            const result = await APIClient.put(`admin.php?action=reject_device_request&id=${id}`, {});
            if (result.success) {
                UIManager.showAlert('Device request rejected', 'success');
                loadPendingDeviceRequests();
            } else {
                UIManager.showAlert(result.message || 'Failed to reject device request', 'danger');
            }
        }

        initAdmin();
    </script>
</body>
</html>
