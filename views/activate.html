<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account - Leave Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 500px; margin: 5rem auto;">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Activate Your Account</h2>
                <p class="text-center" style="color: var(--text-light); margin: 0.5rem 0;">
                    Set a password to finish setting up your LeaveSync account.
                </p>
            </div>

            <div class="card-body">
                <div id="alert-container"></div>

                <form id="activate-form">
                    <div class="form-group">
                        <label for="password">New Password (min. 8 characters)</label>
                        <input type="password" id="password" name="password" required minlength="8">
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Activate Account</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        checkAuth();

        document.getElementById('activate-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (password !== passwordConfirm) {
                UIManager.showAlert('Passwords do not match', 'danger');
                return;
            }

            const result = await AuthManager.setPassword(password);

            if (result.success) {
                UIManager.showAlert('Account activated! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/views/dashboard.html';
                }, 1500);
            } else {
                UIManager.showAlert(result.message || 'Failed to set password', 'danger');
            }
        });
    </script>
</body>
</html>
